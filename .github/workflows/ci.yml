# CI for Rafiq.
#
# Three accounts push straight to main on this repo, so a red tree blocks two
# people who didn't break it. This runs the same checks WORK-SPLIT.md asks for
# before every push — typecheck, build, lint, the app's own browser suite, and
# the schema's test suite — on every branch, so whoever broke it finds out
# rather than the next person.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: typecheck, build, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vite 8 needs Node 22.12+; the repo pins no engines, so CI pins it here.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` is tsc -b && vite build — split so a type error and a
      # bundler error don't look like the same failure in the log.
      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Supabase Edge Functions run on Deno, outside tsc's project. Check them
      # with Deno itself, and run their unit tests (no network: Paymob is a recorder).
      - name: Edge Functions (Deno check + test)
        run: |
          npx --yes deno check supabase/functions/payouts/index.ts supabase/functions/account-deletion/index.ts supabase/functions/admin/index.ts supabase/functions/session-video/index.ts supabase/functions/push-send/index.ts
          npx --yes deno test --no-prompt supabase/functions

      # The admin tool is its own app with its own package.json, so the
      # root tsconfig (`include: ["src"]`) never sees it and nothing above
      # would catch a type error in it.
      #
      # The placeholder Supabase values are not secrets and are not a real
      # project: they exist because Vite inlines `import.meta.env.*` at
      # build time, so with them unset the app's own "not configured"
      # branch is a compile-time constant and the bundler drops the rest
      # of the app. The build would pass while building almost nothing.
      # With them set, this builds the real bundle.
      - name: Admin app (typecheck + build)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          npm ci --prefix admin
          npm run build --prefix admin

  app-tests:
    name: app browser tests
    runs-on: ubuntu-latest

    # These drive the real app in Chromium. They are the only check here that
    # can catch a rendering regression: typecheck, build and lint all pass on
    # a screen that renders Arabic in the wrong order, writes a rating to the
    # wrong row, or mirrors an icon twice.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Only Chromium: the app ships inside a WebView on both platforms, so a
      # second desktop engine would cost minutes without covering anything the
      # product actually runs on.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the Vite dev server itself and waits for
      # it, so there is nothing to launch or tear down here.
      #
      # The auth suites need getSupabase() to construct a client — they then
      # replace every method on it with a recorder, so nothing reaches the
      # network. These are placeholders, not credentials, and they exist only
      # so the constructor does not throw where there is no .env.local. Real
      # values would give the suite a live backend to talk to, which is the
      # opposite of what these tests want.
      - name: Run browser tests
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm test

      # The admin tool's own suite, here rather than in the job above
      # because that one has no browser. Same Playwright version as the
      # root, so the Chromium installed above serves both, and its config
      # starts its own dev server on 5175.
      #
      # Without this the admin tool had a browser suite nothing ran:
      # `checks` typechecks and builds it, which cannot catch a queue that
      # renders nothing or an action that posts the wrong operation.
      - name: Admin tool browser tests
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: |
          npm ci --prefix admin
          npm test --prefix admin

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  schema:
    name: database schema
    runs-on: ubuntu-latest

    # The suite needs a real Postgres — it asserts what RLS policies and check
    # constraints actually do, which nothing can be mocked into answering.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # `a || b && c` would run the install even when psql is already there.
      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      # Given DATABASE_URL, run.sh uses that server instead of building its own
      # cluster, and resets the schema first so the run is self-contained.
      - name: Run schema tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/run.sh
